steps:
# Cloud function to lookup binhosts.
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  id: 'lookup_service_binhosts'
  args:
  - gcloud
  - functions
  - deploy
  - prod-lookup-service-binhosts
  - --entry-point=lookup_service_binhosts
  - --env-vars-file=cloudbuild/.env.prod.yaml
  - --gen2
  - --region=us-central1
  - --runtime=python314
  - --service-account=prod-binhost-lookup-service@chromeos-prebuilts.iam.gserviceaccount.com
  - --source=cloud_functions/.
  - --trigger-http
# IAM policy binding to make the lookup binhosts endpoint public.
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  waitFor:
    - 'lookup_service_binhosts'
  args:
  - gcloud
  - run
  - services
  - add-iam-policy-binding
  - prod-lookup-service-binhosts
  - --member=allUsers
  - --region=us-central1
  - --role=roles/run.invoker
# Cloud function to update binhost metadata.
- name: 'gcr.io/cloud-builders/gcloud'
  entrypoint: 'bash'
  waitFor:
  - '-'
  args:
    - 'cloudbuild/deploy_update_service_function.sh'
  env:
  - 'ENV_FILE=cloudbuild/.env.prod.yaml'
  - 'FUNCTION_NAME=prod-update-service-binhost-data'
  - 'TOPIC_NAME=prod-update_binhost_data'
  - 'VPC_CONNECTOR=prod-prebuilts-conn'
  - 'SERVICE_ACCOUNT=prod-binhost-lookup-service@chromeos-prebuilts.iam.gserviceaccount.com'
# Cloud function to update snapshot metadata.
- name: 'gcr.io/cloud-builders/gcloud'
  entrypoint: 'bash'
  waitFor:
    - '-'
  args:
    - 'cloudbuild/deploy_update_service_function.sh'
  env:
  - 'ENV_FILE=cloudbuild/.env.prod.yaml'
  - 'FUNCTION_NAME=prod-update-service-snapshot-data'
  - 'TOPIC_NAME=prod-update_snapshot_data'
  - 'VPC_CONNECTOR=prod-prebuilts-conn'
  - 'SERVICE_ACCOUNT=prod-binhost-lookup-service@chromeos-prebuilts.iam.gserviceaccount.com'
