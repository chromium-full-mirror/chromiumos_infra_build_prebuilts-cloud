steps:
# Cloud function to lookup binhosts.
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  args:
  - gcloud
  - functions
  - deploy
  - staging-lookup-service-binhosts
  - --entry-point=lookup_service_binhosts
  - --env-vars-file=cloudbuild/.env.staging.yaml
  - --gen2
  - --region=us-central1
  - --runtime=python38
  - --service-account=staging-binhost-lookup-service@chromeos-prebuilts.iam.gserviceaccount.com
  - --source=cloud_functions/.
  - --trigger-http
# IAM policy binding to make the lookup binhosts endpoint public.
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  args:
  - gcloud
  - run
  - services
  - add-iam-policy-binding
  - staging-lookup-service-binhosts
  - --member=allUsers
  - --region=us-central1
  - --role=roles/run.invoker
# Cloud function to update binhost metadata.
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  args:
  - gcloud
  - functions
  - deploy
  - staging-update-service-binhost-data
  - --egress-settings=private-ranges-only
  - --entry-point=update_service
  - --env-vars-file=cloudbuild/.env.staging.yaml
  - --gen2
  - --ingress-settings=internal-only
  - --region=us-central1
  - --retry
  - --runtime=python38
  - --service-account=staging-binhost-lookup-service@chromeos-prebuilts.iam.gserviceaccount.com
  - --source=cloud_functions/.
  - --trigger-topic=staging-update_binhost_data
  - --vpc-connector=staging-prebuilts-conn
# Cloud function to update snapshot metadata.
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  args:
  - gcloud
  - functions
  - deploy
  - staging-update-service-snapshot-data
  - --egress-settings=private-ranges-only
  - --entry-point=update_service
  - --env-vars-file=cloudbuild/.env.staging.yaml
  - --gen2
  - --ingress-settings=internal-only
  - --region=us-central1
  - --retry
  - --runtime=python38
  - --service-account=staging-binhost-lookup-service@chromeos-prebuilts.iam.gserviceaccount.com
  - --source=cloud_functions/.
  - --trigger-topic=staging-update_snapshot_data
  - --vpc-connector=staging-prebuilts-conn
