steps:
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  dir: 'cloud_functions'
  args:
  - gcloud
  - functions
  - deploy
  - staging-lookup-service-binhosts
  - --gen2
  - --region=us-central1
  - --source=.
  - --trigger-http
  - --runtime=python38
  - --entry-point=lookup_service_binhosts
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  dir: 'cloud_functions'
  args:
  - gcloud
  - functions
  - deploy
  - staging-update-service-binhost-data
  - --gen2
  - --region=us-central1
  - --source=.
  - --trigger-topic=staging-update_binhost_data
  - --runtime=python38
  - --entry-point=update_service
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  dir: 'cloud_functions'
  args:
  - gcloud
  - functions
  - deploy
  - staging-update-service-snapshot-data
  - --gen2
  - --region=us-central1
  - --source=.
  - --trigger-topic=staging-update_snapshot_data
  - --runtime=python38
  - --entry-point=update_service
